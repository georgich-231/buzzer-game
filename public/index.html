<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buzzer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f13;
      --surface: #1a1a24;
      --surface2: #24243a;
      --accent: #7c3aed;
      --accent-hover: #6d28d9;
      --accent-light: #a78bfa;
      --green: #22c55e;
      --red: #ef4444;
      --yellow: #eab308;
      --text: #f1f0ff;
      --text-muted: #8b8aab;
      --border: #2e2e46;
      --buzz-active: #f59e0b;
      --buzz-disabled: #374151;
      --radius: 12px;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .logo {
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(135deg, #7c3aed, #a78bfa, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -2px;
      margin-bottom: 8px;
    }

    .tagline { color: var(--text-muted); font-size: 0.95rem; margin-bottom: 40px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      width: 100%;
      max-width: 420px;
    }
    .card + .card { margin-top: 16px; }

    .card-title {
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 16px;
    }

    input[type="text"], input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 1rem;
      outline: none;
      transition: border-color 0.15s;
      margin-bottom: 12px;
    }
    input:focus { border-color: var(--accent-light); }
    input::placeholder { color: var(--text-muted); }
    input.code-input { text-transform: uppercase; letter-spacing: 0.15em; font-weight: 700; font-size: 1.2rem; text-align: center; }

    button {
      width: 100%;
      padding: 13px 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s, opacity 0.15s;
    }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-green { background: var(--green); color: white; }
    .btn-green:hover:not(:disabled) { background: #16a34a; }
    .btn-red { background: var(--red); color: white; }
    .btn-red:hover:not(:disabled) { background: #dc2626; }
    .btn-ghost { background: var(--surface2); color: var(--text-muted); border: 1px solid var(--border); }
    .btn-ghost:hover:not(:disabled) { background: var(--border); color: var(--text); }

    .btn-buzz {
      height: 200px;
      border-radius: 50%;
      width: 200px;
      font-size: 2rem;
      font-weight: 900;
      letter-spacing: 0.05em;
      transition: background 0.15s, transform 0.1s, box-shadow 0.15s;
      margin: 0 auto;
      display: block;
    }
    .btn-buzz.active {
      background: var(--buzz-active);
      color: #000;
      box-shadow: 0 0 60px rgba(245, 158, 11, 0.5);
      animation: pulse-ring 1.5s infinite;
    }
    .btn-buzz.buzzed {
      background: #14532d;
      color: var(--green);
      box-shadow: 0 0 40px rgba(34, 197, 94, 0.3);
    }
    .btn-buzz:disabled { background: var(--buzz-disabled); color: #4b5563; box-shadow: none; }

    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 rgba(245,158,11,0.5), 0 0 60px rgba(245,158,11,0.4); }
      70% { box-shadow: 0 0 0 20px rgba(245,158,11,0), 0 0 60px rgba(245,158,11,0.4); }
      100% { box-shadow: 0 0 0 0 rgba(245,158,11,0), 0 0 60px rgba(245,158,11,0.4); }
    }

    .error { color: var(--red); font-size: 0.875rem; margin-top: -6px; margin-bottom: 8px; }

    #room-screen { width: 100%; max-width: 640px; }

    .room-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .room-code-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-weight: 800;
      font-size: 1.3rem;
      letter-spacing: 0.15em;
      color: var(--accent-light);
      cursor: pointer;
      user-select: all;
    }
    .code-label { font-size: 0.65rem; color: var(--text-muted); font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; display: block; margin-bottom: 2px; }

    .round-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 14px;
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .section { margin-bottom: 20px; }

    .player-list { display: flex; flex-direction: column; gap: 8px; }

    .player-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      transition: border-color 0.2s;
    }
    .player-row.you { border-color: var(--accent); }

    .player-name { font-weight: 600; font-size: 0.95rem; }

    .you-tag {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--accent-light); background: rgba(124,58,237,0.2);
      border-radius: 4px; padding: 2px 6px; margin-left: 8px;
    }

    .buzz-center {
      display: flex; flex-direction: column; align-items: center;
      gap: 20px; padding: 20px 0;
    }
    .buzz-status { font-size: 1rem; color: var(--text-muted); font-weight: 600; text-align: center; }
    .buzz-status.go { color: var(--green); font-size: 1.3rem; }

    .controls { display: flex; flex-direction: column; gap: 10px; }
    .divider { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .waiting-msg { text-align: center; color: var(--text-muted); font-size: 0.95rem; padding: 24px; }

    /* Buzz order list */
    .buzz-list { display: flex; flex-direction: column; gap: 8px; }
    .buzz-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 12px 16px;
      transition: border-color 0.2s, opacity 0.2s;
    }
    .buzz-row.current {
      border-color: var(--buzz-active);
      box-shadow: 0 0 12px rgba(245,158,11,0.25);
    }
    .buzz-row.done { opacity: 0.5; }
    .buzz-place { font-size: 1.4rem; width: 36px; text-align: center; }
    .buzz-name { flex: 1; font-weight: 700; }
    .buzz-pts {
      font-size: 0.85rem; font-weight: 700; padding: 3px 10px;
      border-radius: 20px; background: var(--surface);
    }
    .buzz-pts.awarded { color: var(--green); }
    .buzz-pts.waiting { color: var(--text-muted); }
    .buzz-pts.answering { color: var(--buzz-active); }

    .answering-tag {
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--buzz-active); background: rgba(245,158,11,0.15);
      border-radius: 4px; padding: 2px 6px; margin-left: 4px;
    }

    /* Timer */
    .answer-timer { display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 0; }
    .timer-label { font-size: 0.85rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em; }
    .timer-answering { font-size: 1.1rem; font-weight: 700; color: var(--buzz-active); }
    .timer-circle { position: relative; width: 120px; height: 120px; }
    .timer-circle svg { transform: rotate(-90deg); }
    .timer-circle-bg { fill: none; stroke: var(--surface2); stroke-width: 8; }
    .timer-circle-fg { fill: none; stroke: var(--buzz-active); stroke-width: 8; stroke-linecap: round; transition: stroke-dashoffset 0.1s linear, stroke 0.3s; }
    .timer-number { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 2.2rem; font-weight: 900; color: var(--buzz-active); transition: color 0.3s; }
    .timer-circle.urgent .timer-circle-fg { stroke: var(--red); }
    .timer-circle.urgent .timer-number { color: var(--red); }

    /* Points award */
    .award-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
    }
    .award-box-name {
      font-size: 1.2rem; font-weight: 800; color: var(--text); margin-bottom: 4px;
    }
    .award-box-label {
      font-size: 0.8rem; color: var(--text-muted); margin-bottom: 16px;
    }
    .award-row {
      display: flex; gap: 10px; align-items: center;
    }
    .award-row input {
      margin-bottom: 0; text-align: center; font-size: 1.4rem;
      font-weight: 900; width: 100px; flex-shrink: 0;
    }

    .scoreboard { display: flex; flex-direction: column; gap: 6px; }
    .score-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 14px;
    }
    .score-row.winner { border-color: var(--yellow); }
    .score-position { width: 24px; font-weight: 800; color: var(--text-muted); font-size: 0.85rem; }
    .score-name { flex: 1; font-weight: 700; }
    .score-pts { font-weight: 800; font-size: 1.1rem; color: var(--accent-light); }

    .section-title {
      font-size: 0.75rem; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px;
    }

    .rounds-row { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .rounds-row label { font-size: 0.85rem; color: var(--text-muted); white-space: nowrap; }
    .rounds-row input { margin-bottom: 0; text-align: center; width: 80px; }

    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 20px;
      font-weight: 600; font-size: 0.9rem; opacity: 0;
      transition: opacity 0.2s; pointer-events: none; z-index: 100; white-space: nowrap;
    }
    .toast.show { opacity: 1; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<!-- LANDING -->
<div id="landing-screen">
  <div class="logo">BUZZ!</div>
  <p class="tagline">Real-time buzzer for quiz nights with friends</p>

  <div class="card">
    <div class="card-title">Create a Room</div>
    <input id="create-name" type="text" placeholder="Your name" maxlength="24" />
    <div id="create-error" class="error hidden"></div>
    <button class="btn-primary" onclick="createRoom()">Create Room</button>
  </div>

  <div class="card">
    <div class="card-title">Join a Room</div>
    <input id="join-name" type="text" placeholder="Your name" maxlength="24" />
    <input id="join-code" type="text" placeholder="Room code" class="code-input" maxlength="4" />
    <div id="join-error" class="error hidden"></div>
    <button class="btn-ghost" onclick="joinRoom()">Join Room</button>
  </div>
</div>

<!-- ROOM -->
<div id="room-screen" class="hidden">
  <div class="room-header">
    <div>
      <div id="room-title" style="font-weight:800;font-size:1.4rem;">Room</div>
      <div id="phase-label" style="color:var(--text-muted);font-size:0.85rem;margin-top:2px;"></div>
    </div>
    <div style="display:flex;gap:10px;align-items:center;">
      <div id="round-display" class="round-badge hidden"></div>
      <div onclick="copyCode()" title="Click to copy">
        <div class="room-code-badge">
          <span class="code-label">Room Code</span>
          <span id="room-code-display"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="lobby-section">
    <div class="section">
      <div class="section-title">Players (<span id="player-count">0</span>)</div>
      <div id="lobby-player-list" class="player-list"></div>
    </div>
    <div id="admin-lobby-controls" class="hidden">
      <hr class="divider" />
      <div class="rounds-row">
        <label>Rounds:</label>
        <input id="rounds-input" type="number" min="1" max="50" value="5" />
      </div>
      <button class="btn-green" onclick="startGame()">Start Game</button>
    </div>
    <div id="player-lobby-wait" class="waiting-msg hidden">
      Waiting for the host to start the game...
    </div>
  </div>

  <!-- GAME -->
  <div id="game-section" class="hidden">

    <!-- Buzz button (shown during round_active) -->
    <div id="buzz-section" class="buzz-center hidden">
      <div id="buzz-status" class="buzz-status">Waiting...</div>
      <button id="buzz-btn" class="btn-buzz" disabled onclick="doBuzz()">BUZZ!</button>
    </div>

    <!-- Answer timer (shown during round_timer) -->
    <div id="answer-timer-section" class="answer-timer hidden">
      <div class="timer-label">Time to answer</div>
      <div id="timer-answering" class="timer-answering"></div>
      <div class="timer-circle" id="timer-circle">
        <svg width="120" height="120" viewBox="0 0 120 120">
          <circle class="timer-circle-bg" cx="60" cy="60" r="52"/>
          <circle class="timer-circle-fg" id="timer-arc" cx="60" cy="60" r="52"
            stroke-dasharray="327" stroke-dashoffset="0"/>
        </svg>
        <div class="timer-number" id="timer-number">30</div>
      </div>
    </div>

    <!-- Points award (shown during round_awarding, admin only) -->
    <div id="award-section" class="hidden">
      <div class="award-box">
        <div class="award-box-name" id="award-player-name"></div>
        <div class="award-box-label">How many points?</div>
        <div class="award-row">
          <input type="number" id="points-input" min="0" max="999" value="0" />
          <button class="btn-green" onclick="awardPoints()">Award Points</button>
        </div>
      </div>
    </div>

    <hr class="divider" />

    <!-- Buzz order -->
    <div id="buzz-order-section" class="section hidden">
      <div class="section-title">Buzz Order</div>
      <div id="buzz-order-list" class="buzz-list"></div>
    </div>

    <!-- Scoreboard -->
    <div class="section">
      <div class="section-title">Scoreboard</div>
      <div id="game-scoreboard" class="scoreboard"></div>
    </div>

    <!-- Admin controls -->
    <div id="admin-game-controls" class="controls hidden">
      <button id="btn-start-round" class="btn-green hidden" onclick="startRound()">Open Buzzer</button>
      <button id="btn-end-round" class="btn-red hidden" onclick="endRound()">Close Buzzer</button>
      <button id="btn-already-answered" class="btn-green hidden" onclick="alreadyAnswered()">Already Answered ✓</button>
      <button id="btn-next-round" class="btn-ghost hidden" onclick="nextRound()">Next Round →</button>
    </div>

    <div id="player-game-wait" class="waiting-msg hidden"></div>
  </div>

  <!-- GAME OVER -->
  <div id="gameover-section" class="hidden">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-size:2.5rem;font-weight:900;color:var(--yellow);">Game Over!</div>
      <div style="color:var(--text-muted);margin-top:6px;">Final Standings</div>
    </div>
    <div id="final-scoreboard" class="scoreboard" style="margin-bottom:20px;"></div>
    <div id="admin-gameover-controls" class="hidden">
      <button class="btn-primary" onclick="restartGame()">Play Again</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
let myRoomCode = null;
let isAdmin = false;
let myName = null;
let gameState = null;
let players = [];
let hasBuzzed = false;
let timerInterval = null;
const TIMER_CIRCUMFERENCE = 327;

function show(id) { document.getElementById(id).classList.remove('hidden'); }
function hide(id) { document.getElementById(id).classList.add('hidden'); }
function showToast(msg, dur = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), dur);
}

function createRoom() {
  const name = document.getElementById('create-name').value.trim();
  const err = document.getElementById('create-error');
  if (!name) { err.textContent = 'Enter your name'; err.classList.remove('hidden'); return; }
  err.classList.add('hidden');
  socket.emit('create-room', { name }, (res) => {
    if (!res.ok) { err.textContent = res.error; err.classList.remove('hidden'); return; }
    myRoomCode = res.code; isAdmin = true; myName = name; enterRoom();
  });
}

function joinRoom() {
  const name = document.getElementById('join-name').value.trim();
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  const err = document.getElementById('join-error');
  if (!name) { err.textContent = 'Enter your name'; err.classList.remove('hidden'); return; }
  if (!code) { err.textContent = 'Enter the room code'; err.classList.remove('hidden'); return; }
  err.classList.add('hidden');
  socket.emit('join-room', { code, name }, (res) => {
    if (!res.ok) { err.textContent = res.error; err.classList.remove('hidden'); return; }
    myRoomCode = res.code; isAdmin = false; myName = name; enterRoom();
  });
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !document.getElementById('landing-screen').classList.contains('hidden')) {
    if (document.activeElement === document.getElementById('create-name')) createRoom();
    else if (document.activeElement !== document.getElementById('points-input')) joinRoom();
  }
  if (e.code === 'Space' && !document.getElementById('room-screen').classList.contains('hidden')) {
    const btn = document.getElementById('buzz-btn');
    if (!btn.disabled) { e.preventDefault(); doBuzz(); }
  }
});

function enterRoom() {
  hide('landing-screen');
  show('room-screen');
  document.getElementById('room-code-display').textContent = myRoomCode;
  document.getElementById('room-title').textContent = isAdmin ? 'Host — ' + myName : myName;
}

function copyCode() {
  navigator.clipboard.writeText(myRoomCode).then(() => showToast('Room code copied!'));
}

socket.on('room-update', (data) => {
  players = data.players;
  gameState = data.state;
  renderRoom();
});

socket.on('buzz-update', (buzzOrder) => {
  gameState.buzzOrder = buzzOrder;
  renderBuzzOrder(buzzOrder, gameState.currentAnswererIndex);
  const myEntry = buzzOrder.find(b => b.name === myName);
  if (myEntry) {
    hasBuzzed = true;
    const btn = document.getElementById('buzz-btn');
    btn.classList.remove('active');
    btn.classList.add('buzzed');
    btn.disabled = true;
    const pos = buzzOrder.indexOf(myEntry) + 1;
    document.getElementById('buzz-status').textContent = pos === 1 ? '🥇 You buzzed first!' : `You buzzed — #${pos}`;
    document.getElementById('buzz-status').className = 'buzz-status go';
  }
});

socket.on('promoted-to-admin', () => {
  isAdmin = true;
  document.getElementById('room-title').textContent = 'Host — ' + myName;
  showToast('You are now the host', 3000);
  renderRoom();
});

function renderRoom() {
  const phase = gameState.phase;

  if (phase !== 'lobby') {
    show('round-display');
    document.getElementById('round-display').textContent = `Round ${gameState.round} / ${gameState.totalRounds}`;
  } else {
    hide('round-display');
  }

  const phaseLabels = {
    lobby: 'Lobby', playing: 'Waiting for round',
    round_active: 'Buzz in!', round_timer: 'Answering...',
    round_awarding: 'Awarding points', round_results: 'Round results', game_over: 'Game over',
  };
  document.getElementById('phase-label').textContent = phaseLabels[phase] || '';

  if (phase === 'lobby') {
    show('lobby-section'); hide('game-section'); hide('gameover-section');
    stopTimer(); renderLobby();
  } else if (phase === 'game_over') {
    hide('lobby-section'); hide('game-section'); show('gameover-section');
    stopTimer(); renderGameOver();
  } else {
    hide('lobby-section'); show('game-section'); hide('gameover-section');
    renderGame(phase);
  }
}

function renderLobby() {
  document.getElementById('player-count').textContent = players.length;
  document.getElementById('lobby-player-list').innerHTML = players.map(p => `
    <div class="player-row ${p.name === myName ? 'you' : ''}">
      <span class="player-name">${esc(p.name)}${p.name === myName ? '<span class="you-tag">You</span>' : ''}</span>
    </div>`).join('');
  if (isAdmin) { show('admin-lobby-controls'); hide('player-lobby-wait'); }
  else { hide('admin-lobby-controls'); show('player-lobby-wait'); }
}

function renderGame(phase) {
  const btn = document.getElementById('buzz-btn');
  const status = document.getElementById('buzz-status');
  const buzzOrder = gameState.buzzOrder || [];
  const curIdx = gameState.currentAnswererIndex ?? 0;

  // Section visibility
  hide('buzz-section'); hide('answer-timer-section'); hide('award-section');
  hide('btn-start-round'); hide('btn-end-round'); hide('btn-already-answered'); hide('btn-next-round');
  hide('player-game-wait');

  if (phase === 'playing') {
    hasBuzzed = false;
    stopTimer();
    hide('buzz-order-section');
    if (isAdmin) { show('admin-game-controls'); show('btn-start-round'); }
    else { hide('admin-game-controls'); show('player-game-wait'); document.getElementById('player-game-wait').textContent = 'Waiting for host to open the buzzer...'; }

  } else if (phase === 'round_active') {
    stopTimer();
    show('buzz-section');
    if (!hasBuzzed) {
      btn.className = 'btn-buzz active'; btn.disabled = false;
      status.textContent = 'GO! Buzz in now!'; status.className = 'buzz-status go';
    }
    renderBuzzOrder(buzzOrder, -1);
    if (isAdmin) { show('admin-game-controls'); show('btn-end-round'); }

  } else if (phase === 'round_timer') {
    show('answer-timer-section');
    const current = buzzOrder[curIdx];
    document.getElementById('timer-answering').textContent = current ? `${current.name} is answering...` : '';
    renderBuzzOrder(buzzOrder, curIdx);
    startCountdown(gameState.timerEnd);
    if (isAdmin) { show('admin-game-controls'); show('btn-already-answered'); }
    else { show('player-game-wait'); document.getElementById('player-game-wait').textContent = ''; }

  } else if (phase === 'round_awarding') {
    stopTimer();
    const current = buzzOrder[curIdx];
    renderBuzzOrder(buzzOrder, curIdx);
    if (isAdmin) {
      show('award-section');
      document.getElementById('award-player-name').textContent = current ? current.name : 'Player';
      document.getElementById('points-input').value = '0';
      show('admin-game-controls');
    } else {
      show('player-game-wait');
      document.getElementById('player-game-wait').textContent = current
        ? `Host is awarding points to ${current.name}...` : 'Waiting...';
    }

  } else if (phase === 'round_results') {
    stopTimer();
    show('buzz-section');
    btn.className = 'btn-buzz'; btn.disabled = true;
    status.textContent = 'Round over!'; status.className = 'buzz-status';
    renderBuzzOrder(buzzOrder, -1);
    if (isAdmin) {
      show('admin-game-controls'); show('btn-next-round');
      document.getElementById('btn-next-round').textContent =
        gameState.round >= gameState.totalRounds ? 'See Final Results' : 'Next Round →';
    } else {
      show('player-game-wait'); document.getElementById('player-game-wait').textContent = 'Waiting for next round...';
    }
  }

  // Scoreboard always visible
  const sorted = [...players].sort((a, b) => b.score - a.score);
  document.getElementById('game-scoreboard').innerHTML = sorted.map((p, i) => `
    <div class="score-row">
      <div class="score-position">#${i+1}</div>
      <div class="score-name">${esc(p.name)}${p.name === myName ? '<span class="you-tag">You</span>' : ''}</div>
      <div class="score-pts">${p.score} pts</div>
    </div>`).join('');
}

function renderBuzzOrder(order, currentIdx) {
  if (!order || order.length === 0) { hide('buzz-order-section'); return; }
  show('buzz-order-section');
  const medals = ['🥇', '🥈', '🥉'];
  document.getElementById('buzz-order-list').innerHTML = order.map((b, i) => {
    let rowClass = 'buzz-row';
    let ptsHtml = '';

    if (currentIdx === -1) {
      // round_active or round_results
      if (b.pointsAwarded !== null && b.pointsAwarded !== undefined) {
        ptsHtml = `<span class="buzz-pts awarded">+${b.pointsAwarded} pts</span>`;
      }
    } else if (i < currentIdx) {
      rowClass += ' done';
      ptsHtml = b.pointsAwarded !== null && b.pointsAwarded !== undefined
        ? `<span class="buzz-pts awarded">+${b.pointsAwarded} pts</span>`
        : `<span class="buzz-pts waiting">done</span>`;
    } else if (i === currentIdx) {
      rowClass += ' current';
      ptsHtml = `<span class="buzz-pts answering">answering<span class="answering-tag">NOW</span></span>`;
    } else {
      ptsHtml = `<span class="buzz-pts waiting">waiting</span>`;
    }

    return `<div class="${rowClass}">
      <div class="buzz-place">${medals[i] || `#${i+1}`}</div>
      <div class="buzz-name">${esc(b.name)}${b.name === myName ? '<span class="you-tag">You</span>' : ''}</div>
      ${ptsHtml}
    </div>`;
  }).join('');
}

function renderGameOver() {
  const sorted = [...players].sort((a, b) => b.score - a.score);
  const medals = ['🥇', '🥈', '🥉'];
  document.getElementById('final-scoreboard').innerHTML = sorted.map((p, i) => `
    <div class="score-row ${i === 0 ? 'winner' : ''}">
      <div class="score-position">${medals[i] || `#${i+1}`}</div>
      <div class="score-name">${esc(p.name)}${p.name === myName ? '<span class="you-tag">You</span>' : ''}</div>
      <div class="score-pts">${p.score} pts</div>
    </div>`).join('');
  if (isAdmin) show('admin-gameover-controls');
  else hide('admin-gameover-controls');
}

function startGame() {
  const rounds = parseInt(document.getElementById('rounds-input').value) || 5;
  socket.emit('start-game', { totalRounds: rounds });
}
function startRound() { socket.emit('start-round'); }
function doBuzz() { if (!hasBuzzed) socket.emit('buzz'); }
function endRound() { socket.emit('end-round'); }
function alreadyAnswered() { socket.emit('already-answered'); }
function awardPoints() {
  const pts = parseInt(document.getElementById('points-input').value) || 0;
  socket.emit('award-points', { points: pts });
}
function nextRound() { socket.emit('next-round'); }
function restartGame() { socket.emit('restart-game'); }

function startCountdown(timerEnd) {
  stopTimer();
  const total = 30000;
  function tick() {
    const remaining = Math.max(0, timerEnd - Date.now());
    const secs = Math.ceil(remaining / 1000);
    document.getElementById('timer-number').textContent = secs;
    document.getElementById('timer-arc').style.strokeDashoffset = TIMER_CIRCUMFERENCE * (1 - remaining / total);
    const circle = document.getElementById('timer-circle');
    if (secs <= 10) circle.classList.add('urgent');
    else circle.classList.remove('urgent');
  }
  tick();
  timerInterval = setInterval(tick, 100);
}

function stopTimer() {
  if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
}

function esc(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>
</body>
</html>
